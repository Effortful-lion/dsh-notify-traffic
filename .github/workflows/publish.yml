name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # 提到 job 层：step 的 if 条件只能读到这一层的 env
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # No registry-url here: setup-node would write an .npmrc holding
      # _authToken=${NODE_AUTH_TOKEN}, and that placeholder token makes npm skip
      # OIDC trusted publishing entirely (fails with ENEEDAUTH/E404).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: npm 11.5.1+ (trusted publishing)
        run: npm install -g npm@latest

      - name: Tag 必须等于 package.json 的 version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag != package.json $version" >&2
            exit 1
          fi

      - name: 两个入口的语法自检
        run: |
          node --check index.js
          node --check client.js

      - name: 打包内容自检（.swift 必须在，编译产物不应在）
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.log
          grep -q 'bin/overlay.swift' /tmp/pack.log || { echo "缺少 bin/overlay.swift" >&2; exit 1; }
          if grep -q 'bin/ntf-overlay' /tmp/pack.log; then
            echo "编译产物 bin/ntf-overlay 不应进入发布包" >&2
            exit 1
          fi

      # 首选 OIDC：不需要任何 token。trusted publisher 只授予 staging 时，
      # 会失败并留下说明，下面再用 token 兜底。
      - name: Publish via OIDC
        id: oidc
        continue-on-error: true
        run: npm publish --provenance --access public

      # 回退：仓库里配了 NPM_TOKEN 就用它发布（无 provenance）。
      #
      # 为什么会走到这条分支：在 npm 网页上配置 trusted publisher 需要 sudo 二次验证，
      # 而本机 passkey 只存在 iCloud 钥匙串里、只有 Safari 能调起系统 Passkey 面板；
      # Chrome/Edge/Firefox 拿不到那枚凭据，sudo 走不完，trusted publisher 就配不上。
      # 结论：配置这些操作请用 Safari 打开 npmjs.com。详见 docs/DETAIL.md「发布」。
      #
      # 本条是 continue-on-error 的兜底，所以「发版成功但没有 provenance 徽章」
      # 等于 OIDC 没走通，不是发布失败。
      - name: Publish via NPM_TOKEN
        if: steps.oidc.outcome != 'success' && env.NPM_TOKEN != ''
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          chmod 600 "$HOME/.npmrc"
          npm publish --access public

      - name: Result
        run: |
          if [ "${{ steps.oidc.outcome }}" = "success" ]; then
            echo "### 已通过 OIDC 发布（带 provenance）" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "### 已通过 NPM_TOKEN 发布（无 provenance）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 发布失败：OIDC 未通过，且仓库没有 NPM_TOKEN" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
